name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-runtime.txt
            mcp/requirements.txt
      - name: Install backend and MCP dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r api/requirements.txt
          -r mcp/requirements.txt
      - name: Run backend suite
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  packaging:
    name: Distribution artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and validate MCP package
        run: |
          python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
          python -m build mcp
          python -m twine check mcp/dist/*
      - name: Validate installer and Compose manifest
        env:
          JWT_SECRET: ci-validation-only
          MOUVADAH_CONFIG_DIR: /tmp/mouvadah-config
          MOUVADAH_DATA_DIR: /tmp/mouvadah-data
        run: |
          sh -n packaging/mouvadah
          docker compose -f docker/compose.release.yml config >/dev/null
      - name: Build release images without publishing
        run: |
          docker build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg VERSION=ci \
            -f docker/Dockerfile.api \
            -t mouvadah-api:ci .
          docker build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg VERSION=ci \
            -f docker/Dockerfile.web \
            -t mouvadah-web:ci .
      - name: Upload MCP distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mouvadah-mcp-${{ github.sha }}
          path: mcp/dist/
          if-no-files-found: error
          retention-days: 7

  postgres:
    name: PostgreSQL migration, claim, recovery, and realtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskable_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskable_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-runtime.txt
      - name: Install backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r api/requirements.txt
      - name: Exercise migrations, claim audit, restore, and realtime
        env:
          POSTGRES_TEST_URL: >-
            postgresql://postgres:postgres@127.0.0.1:5432/taskable_test
          POSTGRES_TOOL_HOST_OVERRIDE: 127.0.0.1
          PG_DUMP_COMMAND: >-
            docker run --rm -i --network host -e PGPASSWORD
            postgres:17-alpine pg_dump
          PG_RESTORE_COMMAND: >-
            docker run --rm -i --network host -e PGPASSWORD
            postgres:17-alpine pg_restore
        run: >-
          python -m pytest -q
          api/tests/test_postgres_migrations.py

  e2e:
    name: Realtime E2E
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-runtime.txt
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r api/requirements.txt
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium system dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run authenticated realtime smoke tests
        working-directory: web
        run: npm run test:e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  required-ci:
    name: Required CI
    if: always()
    needs: [backend, frontend, packaging, postgres, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI job
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PACKAGING_RESULT: ${{ needs.packaging.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$BACKEND_RESULT" = "success"
          test "$FRONTEND_RESULT" = "success"
          test "$PACKAGING_RESULT" = "success"
          test "$POSTGRES_RESULT" = "success"
          test "$E2E_RESULT" = "success"
