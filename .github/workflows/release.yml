name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable version tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Reject replacement or non-main releases
        id: release_ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Release tag must be a v-prefixed semantic version." >&2
              exit 1
              ;;
          esac
          git fetch origin main --no-tags
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$release_sha" || {
            echo "Checked-out source does not match $RELEASE_TAG." >&2
            exit 1
          }
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo "Release commit is not on origin/main." >&2
            exit 1
          }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists and will not be replaced." >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >>"$GITHUB_OUTPUT"
          echo "sha=$release_sha" >>"$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate tag and build MCP artifacts
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(
              pathlib.Path("mcp/pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(
                  f"tag {os.environ['RELEASE_TAG']} does not match MCP version {version}"
              )
          PY
          python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
          python -m build --outdir release-assets mcp
          python -m twine check release-assets/*

      - name: Validate installer and Compose manifest
        env:
          JWT_SECRET: release-validation-only
          MOUVADAH_CONFIG_DIR: /tmp/mouvadah-config
          MOUVADAH_DATA_DIR: /tmp/mouvadah-data
        run: |
          sh -n packaging/mouvadah
          docker compose -f docker/compose.release.yml config >/dev/null

      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Prepare image metadata
        id: images
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          {
            echo "version=$version"
            echo "api_tags<<EOF"
            echo "ghcr.io/andrewb1234/mouvadah-api:$version"
            echo "ghcr.io/andrewb1234/mouvadah-api:latest"
            echo "EOF"
            echo "web_tags<<EOF"
            echo "ghcr.io/andrewb1234/mouvadah-web:$version"
            echo "ghcr.io/andrewb1234/mouvadah-web:latest"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Build and publish API image
        id: api_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.images.outputs.api_tags }}
          build-args: |
            VCS_REF=${{ steps.release_ref.outputs.sha }}
            VERSION=${{ steps.images.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Build and publish web image
        id: web_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.images.outputs.web_tags }}
          build-args: |
            VCS_REF=${{ steps.release_ref.outputs.sha }}
            VERSION=${{ steps.images.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Scan API image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/andrewb1234/mouvadah-api@${{ steps.api_image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan web image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/andrewb1234/mouvadah-web@${{ steps.web_image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Assemble checksummed release
        env:
          API_IMAGE_DIGEST: ${{ steps.api_image.outputs.digest }}
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
          WEB_IMAGE_DIGEST: ${{ steps.web_image.outputs.digest }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          compose = pathlib.Path("docker/compose.release.yml").read_text(
              encoding="utf-8"
          )
          digests = {
              "API": os.environ["API_IMAGE_DIGEST"],
              "WEB": os.environ["WEB_IMAGE_DIGEST"],
          }
          for name, digest in digests.items():
              if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
                  raise SystemExit(f"Invalid {name} image digest: {digest}")

          compose, api_count = re.subn(
              r"(?m)^    image: \$\{MOUVADAH_API_IMAGE[^\n]+$",
              (
                  "    image: ghcr.io/andrewb1234/mouvadah-api@"
                  + digests["API"]
              ),
              compose,
          )
          compose, web_count = re.subn(
              r"(?m)^    image: \$\{MOUVADAH_WEB_IMAGE[^\n]+$",
              (
                  "    image: ghcr.io/andrewb1234/mouvadah-web@"
                  + digests["WEB"]
              ),
              compose,
          )
          if (api_count, web_count) != (1, 1):
              raise SystemExit("Expected exactly one API and one web image line.")
          if ":latest" in compose or "MOUVADAH_API_IMAGE" in compose:
              raise SystemExit("Release Compose manifest is not digest-pinned.")
          pathlib.Path("release-assets/compose.yml").write_text(
              compose,
              encoding="utf-8",
          )
          PY
          cp packaging/mouvadah release-assets/mouvadah
          chmod +x release-assets/mouvadah
          printf '%s\n' "${RELEASE_TAG#v}" > release-assets/VERSION
          cp LICENSE release-assets/LICENSE
          cp mcp/LICENSE release-assets/MCP-LICENSE
          cp mcp/NOTICE release-assets/MCP-NOTICE
          cp NOTICE TRADEMARKS.md THIRD_PARTY_NOTICES.md release-assets/
          (
            cd release-assets
            sha256sum * > SHA256SUMS
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --generate-notes \
            --title "Mouvadah $RELEASE_TAG"

  pypi:
    name: Publish MCP package to PyPI
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and validate MCP artifacts
        run: |
          python -m pip install --disable-pip-version-check build==1.3.0 twine==6.2.0
          python -m build mcp
          python -m twine check mcp/dist/*

      - name: Publish MCP package
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: mcp/dist/
