# Build manifest for the standalone Mouvadah MCP server.
#
# Why this exists: the Windsurf / Claude Desktop MCP config has to point at a
# stable command. Hard-coding `<repo>/.venv/bin/python` works until you move
# the repo or recreate the venv. Installing this package globally via pipx or
# uv tool gives you a `mouvadah-mcp` console script that lives outside the
# repo, so the IDE config is durable.
#
# Install:
#   pipx install ./mcp           # recommended
#   uv tool install ./mcp        # alternative
#   pip install ./mcp            # works inside an existing venv
#
# After install, run with `mouvadah-mcp` (stdio).

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mouvadah-mcp"
version = "0.1.1"
description = "MCP stdio bridge from agent harnesses to the Mouvadah API."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andrew Betbadal" }]
keywords = ["mcp", "mouvadah", "agent", "harness", "stdio"]
dependencies = [
    "mcp>=1.1,<3",
    "httpx>=0.27,<0.29",
]

[project.scripts]
mouvadah-mcp = "mcp_server:main"
# Temporary compatibility alias for existing local configurations.
taskable-mcp = "mcp_server:main"

[project.urls]
Homepage = "https://mouvadah.com"
Repository = "https://github.com/andrewb1234/mouvadah"
Issues = "https://github.com/andrewb1234/mouvadah/issues"

[tool.setuptools]
# Flat layout: a single top-level module (`mcp_server.py`) becomes the
# importable name. We deliberately do NOT make `mcp/` a Python package
# because that would shadow the upstream `mcp` SDK at runtime.
py-modules = ["mcp_server"]

[tool.setuptools.packages.find]
# Disable automatic package discovery to keep the wheel minimal.
where = ["."]
include = []
